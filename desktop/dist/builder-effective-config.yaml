directories:
  output: dist
  buildResources: build
appId: com.companyname.taskmanager
productName: COMPANY NAME Task Manager
files:
  - filter:
      - main/**/*
      - preload.js
      - package.json
extraMetadata:
  main: main/main.js
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: main/icon.ico
  sign: false
  certificateFile: null
  certificatePassword: <stripped sensitive data>
nsis:
  oneClick: true
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: COMPANY NAME Task Manager
publish:
  - provider: github
    owner: OWNER_GITHUB_USERNAME
    repo: company-name-task-manager-desktop
electronVersion: 31.7.7
