<!DOCTYPE html>
<html>
<head>
  <title>AI Task Assistant Launcher</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 50px;
      background: #1a1a1a;
      color: white;
    }
    .launcher {
      max-width: 400px;
      margin: 0 auto;
      padding: 30px;
      background: #2a2a2a;
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    .btn {
      background: #4f46e5;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      margin: 10px;
    }
    .btn:hover {
      background: #3730a3;
    }
    .status {
      margin-top: 20px;
      padding: 10px;
      border-radius: 4px;
      font-size: 14px;
    }
    .success {
      background: rgba(34, 197, 94, 0.2);
      border: 1px solid rgba(34, 197, 94, 0.5);
      color: #86efac;
    }
    .error {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid rgba(239, 68, 68, 0.5);
      color: #fca5a5;
    }
  </style>
</head>
<body>
  <div class="launcher">
    <h1>🤖 AI Task Assistant</h1>
    <p>Launch your AI-powered task management popup</p>
    
    <button class="btn" onclick="launchPopup()">
      🚀 Launch AI Assistant
    </button>
    
    <div id="status" style="display: none;"></div>
    
    <div style="margin-top: 30px; font-size: 12px; color: #888;">
      <p>This will open a 256x256 popup window</p>
      <p>Perfect for quick task creation and updates</p>
    </div>
  </div>

  <script>
    let popupWindow = null;
    
    function showStatus(message, type) {
      const statusEl = document.getElementById('status');
      statusEl.textContent = message;
      statusEl.className = `status ${type}`;
      statusEl.style.display = 'block';
      
      setTimeout(() => {
        statusEl.style.display = 'none';
      }, 5000);
    }
    
    function launchPopup() {
      // Check if popup is already open
      if (popupWindow && !popupWindow.closed) {
        popupWindow.focus();
        showStatus('AI Assistant is already open!', 'success');
        return;
      }
      
      // Popup window specifications
      const width = 256;
      const height = 256;
      const left = (screen.width - width) / 2;
      const top = (screen.height - height) / 2;
      
      const features = `
        width=${width},
        height=${height},
        left=${left},
        top=${top},
        scrollbars=no,
        resizable=yes,
        toolbar=no,
        menubar=no,
        location=no,
        directories=no,
        status=no
      `.replace(/\s/g, '');
      
      try {
        // Open the popup window
        popupWindow = window.open(
          'http://localhost:5173/popup.html',
          'AITaskAssistant',
          features
        );
        
        if (popupWindow) {
          popupWindow.focus();
          showStatus('✅ AI Assistant popup launched!', 'success');
          
          // Check if popup was blocked
          setTimeout(() => {
            if (popupWindow.closed) {
              showStatus('❌ Popup was blocked. Please allow popups and try again.', 'error');
            }
          }, 1000);
        } else {
          showStatus('❌ Failed to open popup. Please allow popups and try again.', 'error');
        }
      } catch (error) {
        showStatus('❌ Error launching popup: ' + error.message, 'error');
      }
    }
    
    // Check if development server is running
    window.addEventListener('load', () => {
      fetch('http://localhost:5173/popup.html')
        .then(response => {
          if (!response.ok) {
            throw new Error('Server not running');
          }
          showStatus('✅ Development server is running', 'success');
        })
        .catch(() => {
          showStatus('❌ Development server not running. Please start with: npm run dev', 'error');
        });
    });
  </script>
</body>
</html>
